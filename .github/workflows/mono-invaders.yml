name: MONO / INVADERS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: mono-invaders
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main

      - name: Install rasterization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-cairosvg python3-pil ffmpeg fonts-dejavu-core

      - name: Generate real contribution animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/generate_invaders.py --login matheuscgxlina --output assets/beyond/invaders.svg

      - name: Render 60 fps WebP
        run: /usr/bin/python3 tools/render_webp.py --input assets/beyond/invaders.svg --output assets/beyond/invaders-v5.webp

      - name: Commit only generated assets
        run: |
          git add -- assets/beyond/invaders.svg assets/beyond/invaders-v5.webp
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update contribution arcade'
          git push origin HEAD:main
