name: MONO / INVADERS — REMAKE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/remake/**'
      - '.github/workflows/mono-invaders-remake.yml'
  schedule:
    - cron: '37 3 * * *'
permissions:
  contents: write
concurrency:
  group: mono-invaders-remake
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Check out pinned upstream engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: czl9707/gh-space-shooter
          ref: b24c9792454d1a2e0139ccf72840424e1f83c3f2
          path: .remake-upstream
          persist-credentials: false
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil python3-httpx python3-dotenv fonts-dejavu-core
      - name: Validate remake using synthetic fixture
        run: /usr/bin/python3 tools/remake/render_remake.py --self-test --output /tmp/mono-remake-test.webp
      - name: Generate real contribution animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /usr/bin/python3 tools/remake/render_remake.py --output assets/beyond/invaders-remake.webp
      - name: Publish validated animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          old = "assets/beyond/invaders-v10.svg"
          new = "assets/beyond/invaders-remake.webp"
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace("Every contribution counts. Updated daily from GitHub activity.", "Every contribution counts. Updated daily from GitHub activity. MONO / INVADERS — REMAKE, based on gh-space-shooter (MIT).")
              p.write_text(s)
          PY
          git add -- assets/beyond/invaders-remake.webp README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish MONO Invaders Remake'
          git push origin HEAD:main
